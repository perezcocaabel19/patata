<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas GO - Huacho</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <h1>Plaza de Armas de Huacho - Ventas GO</h1>
  
  <!-- Contenedor principal del juego -->
  <div id="game-container">
    
    <!-- Mapa de fondo -->
    <img src="assets/MAPA2D/MAPA.jpg" id="game-map" alt="Mapa de Huacho">
    
    <!-- Personaje Jugador -->
    <div id="player">
       <img src="assets/PERSONAJE/P1-SINFONDO.png" alt="Personaje 1" id="player-sprite">
    </div>

    <!-- Ejemplo de un punto de interacción (Tienda) invisible sobre Norky's -->
    <button class="shop-trigger" style="top: 25%; left: 15%;" onclick="openShop('Norky\'s')"></button>
    <button class="shop-trigger" style="top: 15%; right: 10%;" onclick="openShop('Chifa Beijing')"></button>

  </div>

  <!-- Modal de Compra -->
  <div id="shop-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="shop-title">Tienda</h2>
      <p>¿Qué deseas comprar?</p>
      <button onclick="buyItem('Pollo a la brasa', 50)">Comprar (50 pts)</button>
      <button class="close-btn" onclick="closeShop()">Cerrar</button>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
